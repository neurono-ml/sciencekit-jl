name: Deploy documentation

on:
  push:
    branches: [docs/documentations]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mdBook from official release binary
        env:
          MDBOOK_VERSION: v0.5.2
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/mdbook/mdbook" --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build book
        run: mdbook build docs

      - name: Generate sitemap and page metadata
        run: node docs/scripts/postbuild.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
